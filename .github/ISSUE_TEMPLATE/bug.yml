name: Bug report
description: バグや不具合を報告する
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        バグの内容をできるだけ詳しく記入してください。

        ### 自動化について
        この Issue は GitHub Actions で検知されることがあります。
        修正が完了して PR を出すときは、以下をこの Issue のコメントに具体的に書いてください。
        - どこを修正したか
        - どう直したか
        - 影響範囲
        - テスト結果
        - 必要ならスクリーンショットや補足
  - type: textarea
    id: bug-description
    attributes:
      label: 不具合の内容
      description: 何が起きたかを記入してください。
      placeholder: 例: ボタンを押すと画面が真っ白になる
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: 再現手順
      description: 不具合を再現する手順を記入してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 期待する動作
      description: 本来どのように動作するべきかを記入してください。
      placeholder: 例: 画面が正しく表示される
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 使用しているブラウザーや端末などを記入してください。
      placeholder: 例: Chrome / Windows 11
    validations:
      required: false
