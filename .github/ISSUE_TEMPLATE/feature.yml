name: Feature request
description: 新機能や改善を提案する
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: 提案したい機能や改善について記入してください。
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような課題や不便さを解決したいかを記入してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する機能
      description: 希望する機能や動作を記入してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した代替案があれば記入してください。
    validations:
      required: false
