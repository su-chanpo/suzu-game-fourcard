name: Question
description: 質問や使い方の相談をする
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        質問の内容と、確認したことがあれば記入してください。

        ### Copilotへの依頼
        @copilot このIssueの質問に回答してください。
        できれば以下を含めて、わかりやすくコメントで整理してください。
        - 何をすべきか
        - 手順
        - 注意点
        - 必要ならサンプルコード
        - 初心者向けの補足
  - type: textarea
    id: question
    attributes:
      label: 質問
      description: 知りたいことを具体的に記入してください。
      placeholder: "例: Google AdSense の登録手順を知りたい"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 背景や試したこと
      description: 質問に関係する背景や、すでに試したことを記入してください。
    validations:
      required: false
