name = "fourcard-game"
main = "worker/index.js"
compatibility_date = "2026-10-03"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws"]

[[durable_objects.bindings]]
name = "GAME_HUB"
class_name = "GameHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameHub"]
